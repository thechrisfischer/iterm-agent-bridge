<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git review pane mock</title>
  <style>
    :root{color-scheme:dark;--bg:#171a1d;--bg-deep:#121517;--line:#343a3f;--line-soft:#262c30;--text:#d8dcde;--muted:#8f989e;--quiet:#7f898f;--blue:#a9cfff;--blue-bg:#233345;--amber:#e8b451;--amber-bg:#302817;--green:#78c999;--red:#ee9189;--mono:"SFMono-Regular","Cascadia Code","Roboto Mono",Menlo,monospace}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg-deep)}body{color:var(--text);font:13px/1.45 var(--mono)}::selection{color:#101417;background:var(--blue)}:focus-visible{outline:1px solid var(--blue);outline-offset:2px}button,input{font:inherit}button{color:inherit}
    .pane{width:min(900px,100%);min-height:100vh;margin:auto;background:var(--bg)}
    .pane-head{min-height:48px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--line);background:#1e2226}.pane-head strong{color:#e6e9ea;font-weight:500}.pane-head .path{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head-actions{display:flex;gap:8px;margin-left:auto}.head-btn{padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:transparent;cursor:pointer;font-size:11px}.head-btn:hover{color:var(--text);background:#2a3035}
    .tree-head{display:flex;align-items:center;gap:9px;padding:11px 14px 8px;color:var(--muted);border-bottom:1px solid var(--line-soft);font-size:12px}.tree-head strong{color:var(--text);font-weight:500}.tree-head .count{color:var(--quiet)}.tree-head .filter{margin-left:auto;color:var(--quiet)}.filter-input{width:145px;padding:3px 5px;border:0;border-bottom:1px solid var(--line);outline:0;color:var(--text);background:transparent;font-size:11px}.filter-input:focus{border-bottom-color:var(--blue)}
    .hint{padding:7px 14px 9px;color:var(--quiet);border-bottom:1px solid var(--line-soft);font-size:11px}.hint kbd{padding:1px 4px;border:1px solid #4a5359;border-radius:2px;color:var(--muted)}
    .repo-list{padding:5px 0 8px}.repo-row{width:100%;display:grid;grid-template-columns:17px minmax(0,1fr) auto auto;align-items:baseline;gap:7px;min-height:28px;padding:4px 14px;border:0;border-left:2px solid transparent;background:transparent;text-align:left;cursor:pointer}.repo-row:hover{background:#21262a}.repo-row[aria-selected=true]{background:var(--blue-bg);border-left-color:var(--blue)}.repo-glyph{color:var(--quiet)}.repo-row.dirty .repo-glyph,.repo-row.dirty .repo-name{color:var(--amber)}.repo-row.clean .repo-name{color:#bec4c7}.repo-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.repo-branch,.repo-state{color:var(--quiet);font-size:11px}.repo-state.dirty{padding:0 4px;border-radius:2px;color:var(--amber);background:var(--amber-bg)}.repo-state.clean{color:var(--green)}.repo-row[aria-selected=true] .repo-branch{color:var(--blue)}
    .divider{height:1px;background:var(--line)}.diff{display:none}.diff.open{display:block}.diff-head{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;color:var(--muted);background:#1c2125;border-bottom:1px solid var(--line-soft)}.diff-head strong{color:var(--blue);font-weight:500}.diff-head .branch{color:var(--quiet)}.diff-head .totals{margin-left:auto;color:var(--amber);font-size:11px}.diff-head .close{margin-left:8px;padding:0 4px;color:var(--quiet);border:0;background:transparent;cursor:pointer}.diff-head .close:hover{color:var(--text)}
    .diff-grid{display:grid;grid-template-columns:minmax(180px,29%) minmax(0,1fr);min-height:250px}.files{border-right:1px solid var(--line-soft);background:#191d20}.files-label{padding:8px 12px 5px;color:var(--quiet);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.file-btn{width:100%;display:flex;align-items:baseline;gap:6px;padding:6px 12px;color:var(--muted);border:0;border-left:2px solid transparent;background:transparent;text-align:left;cursor:pointer}.file-btn:hover{color:var(--text);background:#242a2e}.file-btn.active{color:var(--text);border-left-color:var(--blue);background:#252e35}.file-btn code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.file-btn b{margin-left:auto;color:var(--amber);font-weight:400}.patch{padding:10px 0 16px;overflow:auto;background:#14181a}.patch-path{padding:0 12px 8px;color:var(--muted);font-size:11px}.line{display:grid;grid-template-columns:39px minmax(0,1fr);min-height:20px;padding-right:12px;font-size:11px;line-height:20px;white-space:pre}.line-no{color:var(--quiet);text-align:right;padding-right:9px;user-select:none}.line code{overflow:hidden;text-overflow:ellipsis}.line.add{color:#aee3bb;background:rgba(57,126,77,.14)}.line.del{color:var(--red);background:rgba(179,71,62,.13)}.line.ctx{color:#aeb6bb}
    .collapsed{display:none;padding:11px 14px;color:var(--quiet);border-top:1px solid var(--line-soft);font-size:11px}.collapsed.show{display:block}.footer{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;color:var(--quiet);border-top:1px solid var(--line);font-size:11px}.footer strong{color:var(--muted);font-weight:400}.empty{padding:18px 14px;color:var(--muted)}
    @media(max-width:620px){.tree-head .filter{display:none}.repo-row{grid-template-columns:17px minmax(0,1fr) auto}.repo-branch{display:none}.diff-grid{grid-template-columns:1fr}.files{border-right:0;border-bottom:1px solid var(--line-soft);display:flex;overflow-x:auto}.files-label{display:none}.file-btn{width:auto;min-width:max-content;border-left:0;border-bottom:2px solid transparent}.file-btn.active{border-left-color:transparent;border-bottom-color:var(--blue)}}
  </style>
</head>
<body>
  <main class="pane" aria-label="Git review pane mock">
    <header class="pane-head"><strong>Git review</strong><span class="path">· /Users/cfischer/Code/personal</span><div class="head-actions"><button class="head-btn" id="refresh" type="button">refresh</button><button class="head-btn" type="button" aria-label="More actions">···</button></div></header>
    <section aria-label="Repository tree">
      <div class="tree-head"><span aria-hidden="true">▾</span><strong>personal/</strong><span class="count" id="found">6 repos</span><label class="filter">/ <input class="filter-input" id="filter" placeholder="filter" aria-label="Filter repositories"></label></div>
      <div class="hint"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> open diff <kbd>esc</kbd> close diff</div>
      <div class="repo-list" id="repos" role="listbox" aria-label="Repositories"></div>
    </section>
    <div class="divider"></div>
    <section class="diff" id="diff" aria-label="Selected repository diff"><div class="diff-head"><strong id="diffRepo">iterm-agent-bridge</strong><span class="branch" id="diffBranch">· main</span><span class="totals" id="totals">+42 −18</span><button class="close" id="close" type="button" aria-label="Close diff">×</button></div><div class="diff-grid"><div class="files" id="files"></div><div class="patch" id="patch"></div></div></section>
    <div class="collapsed" id="closedHint">Select a changed repository and press <strong>enter</strong> to open its diff.</div>
    <footer class="footer"><span>scope: <strong>/Users/cfischer/Code/personal/**</strong></span><span id="scan">last scan: just now</span></footer>
  </main>
  <script>
    const repos=[
      {name:'iterm-agent-bridge',branch:'main',dirty:true,files:3,add:42,del:18,data:[{path:'src/agent_terminal_bridge/review.py',lines:[['ctx','  34  def render_review(root="."):'],['del','- 35      status = _git(root, "status", "--short")'],['add','+ 35      repos = discover_repositories(root)'],['add','+ 36      status = summarize_status(repos)'],['ctx','  37      return render_tree(status)']]},{path:'src/agent_terminal_bridge/state.py',lines:[['ctx','  88  last_active = event.timestamp'],['add','+ 89  session.mode = event.mode or "interactive"'],['add','+ 90  session.last_event = event.kind']]},{path:'tests/test_bridge.py',lines:[['ctx','  117  self.assertEqual(record.state, "working")'],['add','+ 118  self.assertIsNotNone(record.last_active)'],['add','+ 119  self.assertEqual(record.mode, "goal")']]}]},
      {name:'codex-playground',branch:'main',dirty:false,data:[]},{name:'home-lab',branch:'feature/backup',dirty:true,files:7,add:121,del:36,data:[{path:'docker-compose.yml',lines:[['del','-  image: postgres:15'],['add','+  image: postgres:16'],['ctx','  volumes:'],['ctx','    - ./data:/var/lib/postgresql/data']]}]},{name:'notes-and-scripts',branch:'main',dirty:false,data:[]},{name:'dotfiles',branch:'macos-setup',dirty:false,data:[]},{name:'website',branch:'refresh/nav',dirty:true,files:2,add:18,del:9,data:[{path:'src/nav.tsx',lines:[['ctx','  20  export function Nav() {'],['del','- 21    return <nav className="old-nav">'],['add','+ 21    return <nav className="rail-nav">']]}]}
    ];
    let selected=0,activeFile=0,open=false,lastScan=Date.now();const $=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function renderRepos(){const q=$('filter').value.trim().toLowerCase();const shown=repos.map((repo,index)=>({repo,index})).filter(x=>x.repo.name.includes(q));$('found').textContent=`${shown.length} repos`;$('repos').innerHTML=shown.length?shown.map(({repo,index})=>`<button class="repo-row ${repo.dirty?'dirty':'clean'}" type="button" role="option" aria-selected="${index===selected}" data-index="${index}"><span class="repo-glyph">${repo.dirty?'●':'○'}</span><span class="repo-name">${esc(repo.name)}</span><span class="repo-branch">${esc(repo.branch)}</span><span class="repo-state ${repo.dirty?'dirty':'clean'}">${repo.dirty?`${repo.files} changed`:'clean'}</span></button>`).join(''):'<div class="empty">No repositories match this filter.</div>';document.querySelectorAll('.repo-row').forEach(row=>row.addEventListener('click',()=>{selected=Number(row.dataset.index);activeFile=0;renderRepos();if(open)renderDiff()}))}
    function renderDiff(){const repo=repos[selected];if(!repo.dirty){open=false;$('diff').classList.remove('open');$('closedHint').classList.add('show');$('closedHint').textContent=`${repo.name} is clean — nothing to diff.`;return}open=true;$('diff').classList.add('open');$('closedHint').classList.remove('show');$('diffRepo').textContent=repo.name;$('diffBranch').textContent=`· ${repo.branch}`;$('totals').textContent=`+${repo.add} −${repo.del}`;$('files').innerHTML=`<div class="files-label">changed files</div>${repo.data.map((file,i)=>`<button class="file-btn ${i===activeFile?'active':''}" type="button" data-file="${i}"><code>${esc(file.path)}</code><b>M</b></button>`).join('')}`;const file=repo.data[activeFile]||repo.data[0];$('patch').innerHTML=`<div class="patch-path">diff /${esc(file.path)}</div>${file.lines.map((line,i)=>`<div class="line ${line[0]}"><span class="line-no">${i+1}</span><code>${esc(line[1])}</code></div>`).join('')}`;document.querySelectorAll('.file-btn').forEach(btn=>btn.addEventListener('click',()=>{activeFile=Number(btn.dataset.file);renderDiff()}))}
    function closeDiff(){$('diff').classList.remove('open');$('closedHint').classList.add('show');$('closedHint').textContent='Select a changed repository and press enter to open its diff.';open=false}
    $('filter').addEventListener('input',renderRepos);$('close').addEventListener('click',closeDiff);$('refresh').addEventListener('click',()=>{lastScan=Date.now();$('scan').textContent='last scan: just now';renderRepos();if(open)renderDiff()});document.addEventListener('keydown',event=>{if(event.target===$('filter'))return;if(event.key==='ArrowDown'){selected=Math.min(repos.length-1,selected+1);renderRepos();event.preventDefault()}if(event.key==='ArrowUp'){selected=Math.max(0,selected-1);renderRepos();event.preventDefault()}if(event.key==='Enter'){renderDiff();event.preventDefault()}if(event.key==='Escape')closeDiff()});setInterval(()=>{const seconds=Math.floor((Date.now()-lastScan)/1000);$('scan').textContent=`last scan: ${seconds<10?'just now':seconds+'s ago'}`},1000);renderRepos();$('closedHint').classList.add('show');
  </script>
</body>
</html>
